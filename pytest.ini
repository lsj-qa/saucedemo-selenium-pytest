[pytest]
python_files = test_*.py
python_functions = test_*

# --strict-markers : 등록하지 않은 마커를 쓰면 오타로 보고 실패시킨다.
#                    마커가 조용히 무시되어 일부 케이스가 실행에서 빠지는 것을 막는다.
addopts = -v --strict-markers

markers =
    smoke: 배포 직후 즉시 확인하는 핵심 흐름. 실패하면 그 빌드는 더 볼 것도 없다.
    regression: 정기 실행하는 전체 검증. 경계값과 되돌리는 동작까지 포함한다.
