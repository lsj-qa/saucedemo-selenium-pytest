name: UI Tests

# 코드가 올라오거나 PR 이 열릴 때 자동 실행. 수동 실행도 가능.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실행 환경 확인
        run: |
          python --version
          google-chrome --version

      - name: 테스트 실행
        run: pytest --headless --html=TestResult.html --self-contained-html

      # 실패했을 때도 리포트를 남겨야 원인을 확인할 수 있으므로 always() 사용
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: TestResult.html
          retention-days: 14
