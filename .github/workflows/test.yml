name: UI Tests

# 코드가 올라오거나 PR 이 열릴 때 자동 실행. 수동 실행도 가능.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # 코드가 그대로여도 대상 사이트가 바뀌면 깨진다.
  # 변경이 없는 날에도 하루 한 번 돌려 그 사실을 먼저 알도록 한다.
  schedule:
    - cron: '0 18 * * *'   # 매일 새벽 3시 (한국 시간)

jobs:
  test:
    # 브라우저와 운영체제를 함께 바꿔가며 실행한다.
    # Edge 는 Windows 에 기본 설치되어 있어, 브라우저 검증과 운영체제 검증을 함께 한다.
    strategy:
      # 한쪽이 깨져도 나머지는 끝까지 돌려야 어느 조합의 문제인지 구분할 수 있다.
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: edge
            os: windows-latest

    name: ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # 리눅스에는 Chrome 이 없을 수 있어 명시적으로 설치한다.
      # Windows 에는 Edge 가 기본 설치되어 있어 별도 설치가 필요 없다.
      - name: Chrome 설치
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 핵심 흐름이 깨진 빌드는 전체를 돌릴 이유가 없다. 먼저 빠르게 걸러낸다.
      - name: 핵심 흐름 확인 (smoke)
        run: pytest --headless --browser ${{ matrix.browser }} -m smoke

      # 전체는 브라우저를 여러 개 띄워 나눠 실행한다.
      - name: 전체 검증 (regression)
        run: >
          pytest --headless --browser ${{ matrix.browser }} -n auto
          --html=TestResult.html --self-contained-html

      # 실패했을 때도 리포트를 남겨야 원인을 확인할 수 있으므로 always() 사용
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: TestResult.html
          retention-days: 14

      # 이 환경에서만 재현되는 실패는 로그만으로 원인을 좁히기 어렵다.
      - name: 실패 화면 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: failures/
          retention-days: 14
          if-no-files-found: ignore

  # 주문 정보 화면에서만 키 입력이 전달되지 않는다.
  # 창을 띄운 환경(xvfb)에서도 같은 현상이 나와, 화면 없이 실행하는 방식은 원인이 아님을 확인했다.
  # 이 작업은 그 비교를 계속 남겨두기 위한 것으로, 어떤 입력 방식이 통했는지를 함께 기록한다.
  input-method-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 가상 화면 설치
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # --headless 를 빼고 실행한다. 창이 실제로 뜬 상태가 된다.
      - name: 창을 띄운 채 주문 테스트 실행
        run: |
          set -o pipefail
          xvfb-run -a pytest test_Checkout.py -s | tee headed.log

      - name: 통한 입력 방식 확인
        if: always()
        run: |
          if grep -q "입력 방식 전환" headed.log; then
            echo "::warning::첫 입력 방식이 통하지 않았다. 아래가 실제로 통한 방식이다."
            grep -A2 "입력 방식 전환" headed.log
          else
            echo "::notice::첫 입력 방식으로 정상 입력되었다"
          fi
