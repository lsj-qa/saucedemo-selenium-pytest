name: UI Tests

# 코드가 올라오거나 PR 이 열릴 때 자동 실행. 수동 실행도 가능.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # 코드가 그대로여도 대상 사이트가 바뀌면 깨진다.
  # 변경이 없는 날에도 하루 한 번 돌려 그 사실을 먼저 알도록 한다.
  schedule:
    - cron: '0 18 * * *'   # 매일 새벽 3시 (한국 시간)

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # 실행 환경에 Chrome 이 있다고 가정하지 않고 명시적으로 설치한다.
      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실행 환경 확인
        continue-on-error: true
        run: |
          python --version
          chrome --version || google-chrome --version || echo "Chrome 버전 확인 생략"

      # 핵심 흐름이 깨진 빌드는 전체를 돌릴 이유가 없다. 먼저 빠르게 걸러낸다.
      - name: 핵심 흐름 확인 (smoke)
        run: pytest --headless -m smoke

      # 전체는 브라우저를 여러 개 띄워 나눠 실행한다.
      - name: 전체 검증 (regression)
        run: pytest --headless -n auto --html=TestResult.html --self-contained-html

      # 실패했을 때도 리포트를 남겨야 원인을 확인할 수 있으므로 always() 사용
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: TestResult.html
          retention-days: 14

      # 이 환경에서만 재현되는 실패는 로그만으로 원인을 좁히기 어렵다.
      - name: 실패 화면 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: failures/
          retention-days: 14
          if-no-files-found: ignore

  # 주문 정보 화면에서 키 입력이 전달되지 않아 값을 직접 넣는 우회로 통과하고 있다.
  # 원인이 '화면 없이 실행하는 방식' 에 있는지 확인하기 위한 비교 실행으로,
  # 같은 테스트를 가상 화면 위에 창을 실제로 띄운 채 돌린다.
  #
  # 우회 기록이 나오지 않으면 원인은 실행 방식에 있는 것이고,
  # 그대로 나오면 실행 방식과 무관한 문제다.
  input-method-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 가상 화면 설치
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # --headless 를 빼고 실행한다. 창이 실제로 뜬 상태가 된다.
      - name: 창을 띄운 채 주문 테스트 실행
        run: |
          set -o pipefail
          xvfb-run -a pytest test_Checkout.py -s | tee headed.log

      - name: 우회 사용 여부 판정
        if: always()
        run: |
          if grep -q "값 직접 입력" headed.log; then
            echo "::warning::창을 띄워도 키 입력이 전달되지 않았다 - 원인은 실행 방식이 아니다"
          else
            echo "::notice::창을 띄우면 키 입력이 정상 전달된다 - 원인은 화면 없이 실행하는 방식에 있다"
          fi
